<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>藇 Expression Set v1.2 No Moth</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08060d;
      --panel: #14101c;
      --line: #2f253b;
      --text: #f4edf8;
      --muted: #b9a9c6;
      --gold: #d5a95f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px;
      background: rgba(8, 6, 13, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 12px;
    }
    nav a {
      flex: 0 0 auto;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      background: #110d17;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 13px;
    }
    main {
      padding: 14px;
      max-width: 1080px;
      margin: 0 auto;
    }
    .note {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #050408;
    }
    figcaption {
      padding: 9px 10px 10px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
    }
    .status {
      display: inline-block;
      margin-right: 6px;
      color: var(--gold);
      font-weight: 700;
    }
    @media (min-width: 760px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>藇 Expression Set v1.2 No Moth</h1>
    <div class="sub">Wei-only expression/action set. Star Moth is intentionally omitted until its model sheet is stable.</div>
    <nav>
      <a href="index.html">Main Gallery</a>
      <a href="yue-expression-set-v1-1.html">v1.1 With Moth</a>
      <a href="star-moth-v1-1.html">Star Moth v1.1</a>
      <a href="yue-character-exploration.html">藇 Exploration</a>
    </nav>
  </header>
  <main>
    <p class="note">Goal: lock Wei's expressions, gaze differences, and costume without companion drift.</p>
    <div class="grid">
      <figure>
        <img src="images/yue-expression-set-v1-2-no-moth/01-opening-invitation-no-moth.png" alt="Opening invitation no moth">
        <figcaption><span class="status">01 v1.2</span>開場引導 / Opening Invitation - no Star Moth</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set-v1-2-no-moth/02-sharp-judgment-no-moth.png" alt="Sharp judgment no moth">
        <figcaption><span class="status">02 v1.2</span>銳利判斷 / Sharp Judgment - no Star Moth</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set-v1-2-no-moth/03-gentle-transition-no-moth.png" alt="Gentle transition no moth">
        <figcaption><span class="status">03 v1.2</span>溫柔過渡 / Gentle Transition - no Star Moth</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set-v1-2-no-moth/04-awkward-contrast-no-moth.png" alt="Awkward contrast no moth">
        <figcaption><span class="status">04 v1.2</span>尷尬反差 / Awkward Contrast - no Star Moth</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set-v1-2-no-moth/05-reading-book-no-moth.png" alt="Reading book no moth">
        <figcaption><span class="status">05 v1.2</span>翻書 / Reading Book - no Star Moth</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set-v1-2-no-moth/06-closing-book-no-moth.png" alt="Closing book no moth">
        <figcaption><span class="status">06 v1.2</span>收書 / Closing Book - no Star Moth</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set-v1-2-no-moth/07-calculation-reveal-no-moth.png" alt="Calculation reveal no moth">
        <figcaption><span class="status">07 v1.2</span>演算揭曉 / Calculation Reveal - no Star Moth</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
