<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Moth v1.1 Model Sheet</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08060d;
      --panel: #14101c;
      --line: #2f253b;
      --text: #f4edf8;
      --muted: #b9a9c6;
      --gold: #d5a95f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px;
      background: rgba(8, 6, 13, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 12px;
    }
    nav a {
      flex: 0 0 auto;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      background: #110d17;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 13px;
    }
    main {
      padding: 14px;
      max-width: 1080px;
      margin: 0 auto;
    }
    .note {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }
    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #050408;
    }
    figcaption {
      padding: 9px 10px 10px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
    }
    .status {
      display: inline-block;
      margin-right: 6px;
      color: var(--gold);
      font-weight: 700;
    }
    @media (min-width: 760px) {
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Star Moth v1.1 Model Sheet</h1>
    <div class="sub">A single-sheet consistency test before placing Star Moth back into Wei interaction scenes.</div>
    <nav>
      <a href="index.html">Main Gallery</a>
      <a href="star-moth-v1.html">Star Moth v1</a>
      <a href="yue-expression-set-v1-2-no-moth.html">藇 No Moth</a>
      <a href="yue-star-moth-interaction-v1.html">藇 × Star Moth</a>
    </nav>
  </header>
  <main>
    <p class="note">Goal: lock body opacity, wing proportions, eye rules, and silhouette before generating separate interaction scenes.</p>
    <figure>
      <img src="images/star-moth-v1-1/star-moth-v1-1-model-sheet.png" alt="Star Moth v1.1 model sheet">
      <figcaption><span class="status">v1.1</span>Model sheet: master, idle, guide, shock, blush, awkward, proud, comfort</figcaption>
    </figure>
  </main>
</body>
</html>
