<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>藇 Expression Set</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08060d;
      --panel: #14101c;
      --line: #2f253b;
      --text: #f4edf8;
      --muted: #b9a9c6;
      --gold: #d5a95f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px;
      background: rgba(8, 6, 13, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 12px;
    }
    nav a {
      flex: 0 0 auto;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      background: #110d17;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 13px;
    }
    main {
      padding: 14px;
      max-width: 1080px;
      margin: 0 auto;
    }
    .note {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #050408;
    }
    figcaption {
      padding: 9px 10px 10px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
    }
    .status {
      display: inline-block;
      margin-right: 6px;
      color: var(--gold);
      font-weight: 700;
    }
    @media (min-width: 760px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>藇 Expression Set</h1>
    <div class="sub">Seven GPT Image 2 expression/action sources for report animation nodes.</div>
    <nav>
      <a href="index.html">Main Gallery</a>
      <a href="yue-expression-set-v1-1.html">v1.1</a>
      <a href="yue-character-exploration.html">藇 Exploration</a>
      <a href="product-flow-batch1.html">Batch 1 Review</a>
    </nav>
  </header>
  <main>
    <p class="note">Reference-locked to the selected Wei image. These are static sources for later subtle animation loops.</p>
    <div class="grid">
      <figure>
        <img src="images/yue-expression-set/01-opening-invitation.png" alt="Opening invitation expression">
        <figcaption><span class="status">01</span>開場引導 / Opening Invitation - lifts her gaze with a gentle inviting half-smile</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set/02-sharp-judgment.png" alt="Sharp judgment expression">
        <figcaption><span class="status">02</span>銳利判斷 / Sharp Judgment - knowing direct gaze, piercing but not cruel</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set/03-gentle-transition.png" alt="Gentle transition expression">
        <figcaption><span class="status">03</span>溫柔過渡 / Gentle Transition - soft warm smile for reassuring bridges</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set/04-awkward-contrast.png" alt="Awkward contrast expression">
        <figcaption><span class="status">04</span>尷尬反差 / Awkward Contrast - glances away with a bashful, wry smile</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set/05-reading-book.png" alt="Reading book expression">
        <figcaption><span class="status">05</span>翻書 / Reading Book - focused on an ornate astrology book</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set/06-closing-book.png" alt="Closing book expression">
        <figcaption><span class="status">06</span>收書 / Closing Book - calmly closing the book at chapter end</figcaption>
      </figure>
      <figure>
        <img src="images/yue-expression-set/07-calculation-reveal.png" alt="Calculation reveal expression">
        <figcaption><span class="status">07</span>演算揭曉 / Calculation Reveal - watching a glowing star chart or astrolabe</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
