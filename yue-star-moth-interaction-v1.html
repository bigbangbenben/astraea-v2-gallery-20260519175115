<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>藇 × Star Moth Interaction v1</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08060d;
      --panel: #14101c;
      --line: #2f253b;
      --text: #f4edf8;
      --muted: #b9a9c6;
      --gold: #d5a95f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px;
      background: rgba(8, 6, 13, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 12px;
    }
    nav a {
      flex: 0 0 auto;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      background: #110d17;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 13px;
    }
    main {
      padding: 14px;
      max-width: 1080px;
      margin: 0 auto;
    }
    .note {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #050408;
    }
    figcaption {
      padding: 9px 10px 10px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
    }
    .status {
      display: inline-block;
      margin-right: 6px;
      color: var(--gold);
      font-weight: 700;
    }
    @media (min-width: 760px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>藇 × Star Moth Interaction v1</h1>
    <div class="sub">First combined interaction pass using Wei no-moth references and Star Moth v1.1 model sheet.</div>
    <nav>
      <a href="index.html">Main Gallery</a>
      <a href="yue-expression-set-v1-2-no-moth.html">藇 No Moth</a>
      <a href="star-moth-v1-1.html">Star Moth v1.1</a>
      <a href="yue-expression-set-v1-1.html">Previous With Moth</a>
    </nav>
  </header>
  <main>
    <p class="note">Goal: test whether Wei and the stabilized Star Moth can share a frame without costume, gaze, or mascot identity drift.</p>
    <div class="grid">
      <figure>
        <img src="images/yue-star-moth-interaction-v1/01-opening-invitation-interaction.png" alt="Opening invitation interaction">
        <figcaption><span class="status">01</span>開場引導 / Opening Invitation</figcaption>
      </figure>
      <figure>
        <img src="images/yue-star-moth-interaction-v1/02-sharp-judgment-interaction.png" alt="Sharp judgment interaction">
        <figcaption><span class="status">02</span>銳利判斷 / Sharp Judgment</figcaption>
      </figure>
      <figure>
        <img src="images/yue-star-moth-interaction-v1/03-gentle-transition-interaction.png" alt="Gentle transition interaction">
        <figcaption><span class="status">03</span>溫柔過渡 / Gentle Transition</figcaption>
      </figure>
      <figure>
        <img src="images/yue-star-moth-interaction-v1/04-awkward-contrast-interaction.png" alt="Awkward contrast interaction">
        <figcaption><span class="status">04</span>尷尬反差 / Awkward Contrast</figcaption>
      </figure>
      <figure>
        <img src="images/yue-star-moth-interaction-v1/05-reading-book-interaction.png" alt="Reading book interaction">
        <figcaption><span class="status">05</span>翻書 / Reading Book</figcaption>
      </figure>
      <figure>
        <img src="images/yue-star-moth-interaction-v1/06-closing-book-interaction.png" alt="Closing book interaction">
        <figcaption><span class="status">06</span>收書 / Closing Book</figcaption>
      </figure>
      <figure>
        <img src="images/yue-star-moth-interaction-v1/07-calculation-reveal-interaction.png" alt="Calculation reveal interaction">
        <figcaption><span class="status">07</span>演算揭曉 / Calculation Reveal</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
