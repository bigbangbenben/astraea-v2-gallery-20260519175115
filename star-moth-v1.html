<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Moth v1</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08060d;
      --panel: #14101c;
      --line: #2f253b;
      --text: #f4edf8;
      --muted: #b9a9c6;
      --gold: #d5a95f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px;
      background: rgba(8, 6, 13, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 12px;
    }
    nav a {
      flex: 0 0 auto;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      background: #110d17;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 13px;
    }
    main {
      padding: 14px;
      max-width: 1080px;
      margin: 0 auto;
    }
    .note {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #050408;
    }
    figcaption {
      padding: 9px 10px 10px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
    }
    .status {
      display: inline-block;
      margin-right: 6px;
      color: var(--gold);
      font-weight: 700;
    }
    @media (min-width: 760px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Star Moth v1</h1>
    <div class="sub">Standalone mascot master and seven manga reaction expressions for Wei.</div>
    <nav>
      <a href="index.html">Main Gallery</a>
      <a href="yue-expression-set-v1-1.html">藇 Expressions v1.1</a>
      <a href="yue-character-exploration.html">藇 Exploration</a>
    </nav>
  </header>
  <main>
    <p class="note">Design intent: a refined night-lamp messenger that adds comic timing and warmth without replacing Wei's high-cold role.</p>
    <div class="grid">
      <figure>
        <img src="images/star-moth-v1/00-star-moth-master-v1.png" alt="Star Moth Master v1">
        <figcaption><span class="status">Master</span>Star Moth Mascot Master v1</figcaption>
      </figure>
      <figure>
        <img src="images/star-moth-v1/01-elegant-idle-hover.png" alt="Elegant idle hover">
        <figcaption><span class="status">01</span>Elegant Idle Hover</figcaption>
      </figure>
      <figure>
        <img src="images/star-moth-v1/02-soft-guide.png" alt="Soft guide">
        <figcaption><span class="status">02</span>Soft Guide</figcaption>
      </figure>
      <figure>
        <img src="images/star-moth-v1/03-shocked-she-said-it.png" alt="Shocked she said it">
        <figcaption><span class="status">03</span>Shocked "She Said It"</figcaption>
      </figure>
      <figure>
        <img src="images/star-moth-v1/04-blush-wing-cover.png" alt="Blush wing cover">
        <figcaption><span class="status">04</span>Blush Wing-Cover</figcaption>
      </figure>
      <figure>
        <img src="images/star-moth-v1/05-sweat-drop-awkward.png" alt="Sweat drop awkward">
        <figcaption><span class="status">05</span>Sweat-Drop Awkward</figcaption>
      </figure>
      <figure>
        <img src="images/star-moth-v1/06-proud-tiny-sparkle.png" alt="Proud tiny sparkle">
        <figcaption><span class="status">06</span>Proud Tiny Sparkle</figcaption>
      </figure>
      <figure>
        <img src="images/star-moth-v1/07-quiet-comfort-perch.png" alt="Quiet comfort perch">
        <figcaption><span class="status">07</span>Quiet Comfort Perch</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
